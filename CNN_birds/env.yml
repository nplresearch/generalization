name: miller_law
channels:
  - pytorch        # provides PyTorch / torchvision builds
  - conda-forge

# Only the libraries that the project imports directly.
dependencies:
  - python>=3.9
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - pytorch        # solver will pick correct CPU/CUDA build for the platform
  - torchvision
  - matplotlib
  - seaborn
  - pillow         # provides the PIL module
  - pyyaml

  # Optional tools for notebooks ─ uncomment if you need them
  # - jupyterlab
  # - ipykernel

  # pip-only packages can go under a pip: subsection, e.g.
  - pip:
    # - wandb 
    - dendropy